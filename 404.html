<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found | Melrose Cub Scout Pack 615</title>
    <link rel="icon" href="/assets/cub-scouts-logo-black.png" type="image/png">
    <link rel="stylesheet" href="/assets/site.css?v=98">
    <style>
      .nf { width: min(38rem, calc(100% - 2.5rem)); margin: 0 auto; padding: 4.5rem 0 5rem; text-align: center; }
      .nf img { width: 5rem; height: 5rem; margin: 0 auto 1.4rem; object-fit: contain; }
      .nf h1 { margin: 0 0 .7rem; font-family: var(--display); font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
      .nf p { margin: 0 auto 1.9rem; max-width: 28rem; color: var(--muted); font-size: 1.05rem; }
      .nf-links { display: flex; flex-wrap: wrap; gap: .8rem; justify-content: center; }
      .nf-help { margin: 2.6rem 0 0; font-size: .92rem; color: var(--muted); }
      .nf-help a { color: var(--pine); font-weight: 800; }
    </style>
  </head>
  <body>
    <!-- GitHub Pages serves this for any unknown path. Before it existed a
         mistyped address, or an old link from a flyer or an email, dropped a
         parent on a bare GitHub error screen with no way back to the pack. -->
    <main class="nf">
      <img src="/assets/cub-scouts-logo-black.png" alt="">
      <h1>We cannot find that page</h1>
      <p>The link may be out of date, or the address may have a typo in it. Everything about Pack 615 is still here.</p>
      <div class="nf-links">
        <a class="button button-primary" href="/">Go to the main page</a>
        <a class="button button-outline" href="/register/">Registration</a>
      </div>
      <p class="nf-help">Still stuck? <a href="mailto:pack615cubscouts@gmail.com">Email us</a> and we will send you the right link.</p>
    </main>
  </body>
</html>
